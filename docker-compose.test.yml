# Local TREK instance for manually testing this plugin.
#
#   docker compose -f docker-compose.test.yml up -d      # start TREK on http://localhost:3737
#   ./scripts/test-local.sh                              # build+install the plugin and seed a demo trip
#   docker compose -f docker-compose.test.yml down -v    # stop and WIPE all data (fresh start)
#
# Pin the image tag to the TREK version you want to test against (match the plugin's
# `trek` range in trek-plugin.json), and bump it as new TREK builds land.
services:
  trek:
    image: mauriceboe/trek:5-pre
    container_name: trek-timeline-test
    ports:
      - '3737:3000'
    environment:
      - PORT=3000
      - NODE_ENV=production
    volumes:
      - trek-data:/app/data
    healthcheck:
      # app-config needs no auth; it answers as soon as the API is accepting requests.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/auth/app-config').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 40

volumes:
  trek-data:
